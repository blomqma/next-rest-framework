name: "CI"

on:
  push:
    # pkg 是发布分支：根的 package.json 是发布元数据（没有 ci 脚本，dist 是构建产物），
    # 在这条上跑 build/lint/test 没有意义。它的源码与 main 保持一致，由 main 的 CI 把关。
    branches-ignore:
      - "pkg"

jobs:
  build:
    name: "Run CI pipeline"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v3
      - uses: pnpm/action-setup@v2
        with:
          version: 9
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: "pnpm"
      - run: pnpm i --frozen-lockfile
      - run: pnpm run ci

      - name: Coverage
        uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: false
